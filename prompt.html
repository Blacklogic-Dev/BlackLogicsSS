<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackLogic | AI Command Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00ffff;
            --neon-pink: #f472b6;
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.8);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .studio-header {
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .input-field {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--neon-blue);
            outline: none;
            background: rgba(0, 255, 255, 0.08);
        }

        .prompt-card {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .prompt-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--neon-blue);
        }

        .design-card::before { background: var(--neon-pink); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-gateway-btn {
            font-size: 10px;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-chatgpt { background: #10a37f; color: white; }
        .btn-gemini { background: white; color: #1a73e8; }
        .ai-gateway-btn:hover { filter: brightness(1.2); transform: scale(1.05); }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="studio-header p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-400 rounded flex items-center justify-center text-black font-extrabold">B</div>
            <h1 class="text-sm tracking-widest uppercase font-bold">BlackLogic_Nexus // Studio</h1>
        </div>
        <div class="flex gap-2">
            <button id="devBtn" class="text-[10px] font-bold px-4 py-2 rounded-lg border border-cyan-400/30 text-cyan-400 hover:bg-cyan-400 hover:text-black">ENGINEERING</button>
            <button id="designBtn" class="text-[10px] font-bold px-4 py-2 rounded-lg border border-pink-400/30 text-pink-400 hover:bg-pink-400 hover:text-black">DESIGN_LAB</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 mt-12">
        
        <!-- Forms same as before but styled for Nexus -->
        <section id="devForm" class="space-y-6">
            <h2 class="text-xl font-bold uppercase italic text-cyan-400">Code Architecture</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="devLang" class="input-field p-4 rounded-xl text-sm" placeholder="Language Stack (e.g. Python/Tailwind)">
                <input type="text" id="devProject" class="input-field p-4 rounded-xl text-sm" placeholder="Project Name/Function">
            </div>
            <textarea id="devExtra" class="input-field p-4 rounded-xl text-sm h-32 w-full" placeholder="Specify constraints (e.g. Cloud deployment, Error handling)"></textarea>
            <button onclick="generateDevPrompt()" class="w-full bg-cyan-400 text-black py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Assemble Engineering Prompt</button>
        </section>

        <section id="designForm" class="hidden space-y-6">
            <h2 class="text-xl font-bold uppercase italic text-pink-400">Visual Synthesis</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="logoIcon" class="input-field p-4 rounded-xl text-sm" placeholder="Visual Subject (e.g. Exoskeleton)">
                <input type="text" id="logoStyle" class="input-field p-4 rounded-xl text-sm" placeholder="Theme (e.g. Industrial Minimalist)">
            </div>
            <input type="text" id="logoColors" class="input-field p-4 rounded-xl text-sm w-full" placeholder="Color Palette (Hex or Names)">
            <button onclick="generateDesignPrompt()" class="w-full bg-pink-400 text-black py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Assemble Visual Prompt</button>
        </section>

        <!-- Prompt Output Feed -->
        <div class="mt-16">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Generated_Access_Tokens</h3>
            <div id="resultsFeed" class="space-y-6">
                <!-- Cards appear here -->
            </div>
        </div>
    </main>

    <script>
        // Form Switching
        const devForm = document.getElementById('devForm');
        const designForm = document.getElementById('designForm');
        document.getElementById('devBtn').addEventListener('click', () => { devForm.classList.remove('hidden'); designForm.classList.add('hidden'); });
        document.getElementById('designBtn').addEventListener('click', () => { designForm.classList.remove('hidden'); devForm.classList.add('hidden'); });

        function createResultCard(text, isDesign = false) {
            const feed = document.getElementById('resultsFeed');
            const card = document.createElement('div');
            card.className = `prompt-card ${isDesign ? 'design-card' : ''} p-6 rounded-xl space-y-4`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <p class="text-xs leading-relaxed text-slate-300 font-mono flex-1">${text}</p>
                    <button onclick="copyText(this)" class="ml-4 text-slate-500 hover:text-cyan-400"><i class="fas fa-copy"></i></button>
                </div>
                <div class="flex gap-3 pt-2 border-t border-white/5">
                    <a href="https://chatgpt.com/" target="_blank" class="ai-gateway-btn btn-chatgpt">
                        <i class="fas fa-terminal"></i> USE IN CHATGPT
                    </a>
                    <a href="https://gemini.google.com/" target="_blank" class="ai-gateway-btn btn-gemini">
                        <i class="fas fa-wand-magic-sparkles"></i> USE IN GEMINI
                    </a>
                </div>
            `;
            feed.prepend(card);
        }

        function generateDevPrompt() {
            const lang = document.getElementById('devLang').value;
            const project = document.getElementById('devProject').value;
            const extra = document.getElementById('devExtra').value;
            if(!project) return alert("Missing Project Context");
            
            const prompt = `System Architect Mode: Build a ${project} using ${lang}. Requirements: ${extra}. Output high-performance code with a focus on BlackLogic software standards.`;
            createResultCard(prompt, false);
        }

        function generateDesignPrompt() {
            const icon = document.getElementById('logoIcon').value;
            const style = document.getElementById('logoStyle').value;
            const colors = document.getElementById('logoColors').value;
            if(!icon) return alert("Missing Visual Subject");

            const prompt = `Industrial Design Mode: Generate a high-fidelity ${style} of ${icon} using ${colors}. Resolution: 8k, Unreal Engine 5 aesthetic, professional vector quality.`;
            createResultCard(prompt, true);
        }

        function copyText(btn) {
            const text = btn.parentElement.parentElement.querySelector('p').innerText;
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('i');
            icon.className = 'fas fa-check text-green-400';
            setTimeout(() => icon.className = 'fas fa-copy text-slate-500', 1000);
        }
    </script>
</body>
</html>
