<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackLogic | Secure Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffff;
            --error: #ff4b2b;
            --success: #00ff88;
            --glass: rgba(10, 10, 12, 0.85);
            --border: rgba(0, 255, 255, 0.2);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Using a deep, industrial dark theme to match your studio */
            background: radial-gradient(circle at center, #1a1a1e 0%, #050507 100%);
            color: #fff;
            overflow: hidden;
        }

        /* Industrial Logo Styling */
        .logo {
            width: 180px;
            height: auto;
            border-radius: 50%;
            border: 2px solid var(--border);
            margin-bottom: 30px;
            animation: breathe 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.03); filter: brightness(1.2); }
        }

        /* Glassmorphism Container */
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--primary);
            margin-bottom: 30px;
        }

        /* Input Fields */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        /* Button Logic */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
            margin-top: 10px;
        }

        #verifyBtn {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        #verifyBtn:hover:not(:disabled) {
            background: var(--primary);
            color: #000;
        }

        #loginBtn {
            background: var(--success);
            color: #000;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        /* Loading & Messages */
        .loading-dots {
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 50% { opacity: 0.5; } }

        .msg {
            margin-top: 20px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            display: none;
        }

        #error-msg { color: var(--error); }
        #success-msg { color: var(--success); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body>

    <img src="soft.jpg" alt="BlackLogic" class="logo">

    <div class="login-card">
        <h2>Auth Protocol</h2>
        
        <div class="input-group">
            <input type="text" id="uniqueID" placeholder="ID (e.g. KX0011)" autocomplete="off">
        </div>
        
        <div class="input-group">
            <input type="password" id="accessCode" placeholder="Access Code">
        </div>

        <button class="btn" id="verifyBtn" onclick="verifyLogin()">Initialize Verify</button>
        
        <div class="msg" id="error-msg">ACCESS DENIED: REDIRECTING...</div>
        <div class="msg" id="success-msg">IDENTITY CONFIRMED // LINK READY</div>
        
        <button class="btn" id="loginBtn" onclick="goToDashboard()">Enter Studio</button>
    </div>

    <script>
        const validIDs = ["KX0011", "KX1011", "KX1100", "KX1110"];
        const accessCode = "Logic@26";
        let attempts = 0;
        const maxAttempts = 3;
        let verified = false;

        function verifyLogin() {
            const id = document.getElementById("uniqueID").value.trim().toUpperCase();
            const code = document.getElementById("accessCode").value.trim();
            const btn = document.getElementById("verifyBtn");
            const error = document.getElementById("error-msg");
            const success = document.getElementById("success-msg");
            const loginBtn = document.getElementById("loginBtn");

            if (attempts >= maxAttempts) return;

            // UI Feedback: Loading
            btn.innerHTML = 'VERIFYING<span class="loading-dots">...</span>';
            btn.disabled = true;
            error.style.display = "none";

            setTimeout(() => {
                if(validIDs.includes(id) && code === accessCode) {
                    verified = true;
                    btn.style.display = "none";
                    success.style.display = "block";
                    loginBtn.style.display = "block";
                } else {
                    attempts++;
                    btn.innerHTML = "Initialize Verify";
                    btn.disabled = false;
                    error.innerText = `SECURITY BREACH: ${attempts}/${maxAttempts} ATTEMPTS`;
                    error.style.display = "block";

                    if(attempts >= maxAttempts) {
                        btn.disabled = true;
                        btn.style.opacity = "0.5";
                        error.innerText = "TERMINAL LOCKED: CONTACT ADMIN";
                    }
                }
            }, 1800);
        }

        function goToDashboard() {
            if(verified) {
                document.body.style.opacity = "0";
                document.body.style.transition = "0.8s";
                setTimeout(() => window.location.href = "dashboard.html", 800);
            }
        }
    </script>
</body>
</html>
