<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackLogic | AI Code Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00ffff;
    --bg: #020617;
    --card: rgba(30, 41, 59, 0.5);
    --border: rgba(0, 255, 255, 0.2);
  }

  body {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Secure Header */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.5rem;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }

  .brand { display: flex; align-items: center; gap: 1rem; }

  #header img {
    height: 32px;
    filter: drop-shadow(0 0 5px var(--neon));
  }

  #header h1 {
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 2px;
    font-weight: 700;
    color: var(--neon);
  }

  .nav-controls button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--neon);
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    display: none; /* Shown when editor is active */
    transition: 0.3s;
  }

  .nav-controls button:hover { background: rgba(0, 255, 255, 0.1); }

  /* Grid Selection */
  #selection-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
  }

  .grid-option {
    width: 280px;
    height: 320px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }

  .grid-option::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.05));
    pointer-events: none;
  }

  .grid-option:hover {
    transform: translateY(-10px);
    border-color: var(--neon);
    box-shadow: 0 10px 30px rgba(0, 255, 255, 0.15);
  }

  .grid-option i {
    font-size: 3.5rem;
    margin-bottom: 1.5rem;
    color: var(--neon);
    filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.3));
  }

  .grid-option span {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 1rem;
  }

  .grid-option p {
    font-size: 11px;
    color: #64748b;
    margin-top: 1rem;
    max-width: 80%;
    text-align: center;
  }

  /* Full Screen Editor */
  #editor-container {
    flex: 1;
    display: none;
    background: #1e1e1e;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>

<div id="header">
  <div class="brand">
    <img src="Black.png" alt="Logo">
    <h1>CODE_HUB // TERMINAL</h1>
  </div>
  <div class="nav-controls">
    <button id="switchBtn" onclick="resetView()">
      <i class="fas fa-exchange-alt mr-2"></i> SWITCH_ENVIRONMENT
    </button>
  </div>
</div>

<div id="selection-container">
  <div class="grid-option" id="frontend">
    <i class="fas fa-code"></i>
    <span>Front-end</span>
    <p>JSFiddle Sandbox for UI/UX & Component Prototyping</p>
  </div>
  
  <div class="grid-option" id="backend">
    <i class="fas fa-database"></i>
    <span>Back-end</span>
    <p>Multi-language IDE for System Logic & Data Security</p>
  </div>
</div>

<div id="editor-container">
  <iframe id="editorIframe"></iframe>
</div>

<script>
  const selectionContainer = document.getElementById('selection-container');
  const editorContainer = document.getElementById('editor-container');
  const editorIframe = document.getElementById('editorIframe');
  const switchBtn = document.getElementById('switchBtn');

  const editors = {
    frontend: 'https://jsfiddle.net/',
    backend: 'https://www.online-ide.com/'
  };

  function loadEditor(type) {
    editorIframe.src = editors[type];
    selectionContainer.style.display = 'none';
    editorContainer.style.display = 'block';
    switchBtn.style.display = 'block';
  }

  function resetView() {
    editorIframe.src = "";
    selectionContainer.style.display = 'flex';
    editorContainer.style.display = 'none';
    switchBtn.style.display = 'none';
  }

  document.getElementById('frontend').addEventListener('click', () => loadEditor('frontend'));
  document.getElementById('backend').addEventListener('click', () => loadEditor('backend'));
</script>

</body>
</html>
