<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackLogic | Meeting Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffff;
            --bg: #0a0a0a;
            --panel: rgba(20, 20, 25, 0.8);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg);
            color: #e2e8f0;
        }

        /* Live Indicator Pulse */
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ff0000;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Responsive Typewriter */
        .typewriter-box {
            border-left: 3px solid var(--neon);
            padding-left: 15px;
            min-height: 60px;
        }

        .typewriter {
            color: var(--neon);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Terminal Comments */
        .comments-container {
            background: var(--panel);
            border: 1px solid rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            scrollbar-width: thin;
            scrollbar-color: var(--neon) transparent;
        }

        .comment {
            font-size: 13px;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .comment .user { color: var(--neon); font-weight: bold; margin-right: 8px; }

        .btn-action {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon);
            color: var(--neon);
            transition: all 0.3s;
        }

        .btn-action:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .video-wrapper {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto w-full">
        <!-- Header Info -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tighter uppercase flex items-center">
                    <span class="live-dot"></span> Meeting_Studio // Live
                </h1>
                <p class="text-[10px] text-slate-500 mono mt-1">STREAM_ID: BL-STUDIO-2026</p>
            </div>
            <div class="bg-black/40 px-4 py-2 rounded-full border border-white/5 text-xs">
                <i class="fas fa-users text-cyan-400 mr-2"></i> 
                <span id="participant-counter" class="mono">Initializing...</span>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Video & Welcome (Left 2 Columns) -->
            <div class="lg:col-span-2 space-y-6">
                <div class="video-wrapper rounded-2xl overflow-hidden bg-black aspect-video relative">
                    <iframe id="youtube-video" 
                        class="w-full h-full"
                        src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" 
                        title="BlackLogic Live" frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="typewriter-box bg-white/5 p-6 rounded-r-xl">
                    <p class="typewriter" id="typewriter-msg"></p>
                </div>

                <div class="flex gap-4">
                    <button id="likeBtn" class="btn-action flex-1 py-3 rounded-xl font-bold text-sm uppercase mono">
                        <i class="fas fa-heart mr-2"></i> Like [<span id="likeCount">0</span>]
                    </button>
                    <button id="shareBtn" class="btn-action flex-1 py-3 rounded-xl font-bold text-sm uppercase mono">
                        <i class="fas fa-share-nodes mr-2"></i> Share_Link
                    </button>
                </div>
            </div>

            <!-- Terminal Chat (Right Column) -->
            <div class="flex flex-col h-[500px] lg:h-auto">
                <div class="flex-1 comments-container rounded-t-2xl p-4 overflow-y-auto" id="commentsContainer">
                    <!-- Terminal entries -->
                </div>
                <div class="p-2 bg-black/60 rounded-b-2xl border-x border-b border-white/10">
                    <div class="flex gap-2">
                        <input type="text" id="commentInput" 
                            class="bg-white/5 border border-white/10 rounded-lg flex-1 px-4 py-2 text-xs focus:outline-none focus:border-cyan-400" 
                            placeholder="Type message...">
                        <button onclick="addComment()" class="bg-cyan-400 text-black px-4 rounded-lg hover:bg-white transition-colors">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Smooth Typewriter
        const text = "System access granted. Welcome to BlackLogic Meeting Studio. Today we explore the convergence of AI, industrial design, and engineering logic. Stay active in the feed.";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter-msg").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 40);
            }
        }
        typeWriter();

        // Participant Logic
        let participants = 124; // Simulated starting point
        const counterEl = document.getElementById('participant-counter');
        
        setInterval(() => {
            participants += Math.floor(Math.random() * 3);
            counterEl.textContent = `WATCHING: ${participants}`;
        }, 5000);

        // Likes
        let likes = parseInt(localStorage.getItem('likes')) || 42;
        const likeCount = document.getElementById('likeCount');
        
        document.getElementById('likeBtn').addEventListener('click', function() {
            likes++;
            likeCount.textContent = likes;
            localStorage.setItem('likes', likes);
            this.style.transform = "scale(0.95)";
            setTimeout(() => this.style.transform = "scale(1)", 100);
        });
        likeCount.textContent = likes;

        // Comments
        function addComment() {
            const input = document.getElementById('commentInput');
            const container = document.getElementById('commentsContainer');
            if(!input.value.trim()) return;

            const div = document.createElement('div');
            div.className = 'comment';
            div.innerHTML = `<span class="user">> USER_GUEST:</span> ${input.value}`;
            container.appendChild(div);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        // Enter key to send
        document.getElementById('commentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addComment();
        });
    </script>
</body>
</html>
